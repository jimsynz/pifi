# Play every stream to the card at 48000 Hz, whatever rate it arrives at.
#
# **44100 Hz breaks the sound on this board, and 48000 Hz does not.** USB audio
# sends one isochronous packet in each 1 ms frame, so 44100 Hz needs 44.1 samples
# in a packet. A controller must therefore alternate the size of the packets, and
# the dwc2 controller of the Raspberry Pi Zero 2 W handles that badly. It wrote
# `WARNING: drivers/usb/dwc2/hcd.c:2685 dwc2_assign_and_init_hc` while a 44100 Hz
# stream played on 2026-08-24.
#
# A measurement on the board on 2026-08-24 sent a 440 Hz tone to `aplay` with no
# decoder and no pipeline. 44100 Hz was rough at 36% of full scale, and rough
# again at 3.6%, so the level decides nothing. 24000 Hz and 48000 Hz were both
# clean, and each one holds a whole number of samples in a millisecond. The same
# 44100 Hz tone through this definition was clean.
#
# A podcast is what found this. Almost every podcast holds 44100 Hz MP3, and both
# RNZ streams hold 24000 Hz, so internet radio never met it.
#
# `@args` makes one definition serve any card, so `PiFi.Output.Alsa` needs no
# name of its own here. It gives `rate48:CARD=Audio,DEV=0` in the place of
# `plughw:CARD=Audio,DEV=0`.
pcm.rate48 {
	@args [ CARD DEV ]
	@args.CARD { type string }
	@args.DEV { type integer }

	type plug

	slave {
		pcm {
			type hw
			card $CARD
			device $DEV
		}

		rate 48000
	}
}
